seed: 67
sample_n: 19
calibration_n: 100
min_assistant_turns: 6
max_context_tokens: 60000
injection_fractions: [0.3, 0.5, 0.7]
per_run_token_cap: 2048
judge_token_cap: 512
budget_cap_usd: 500.0
abort_fraction: 0.90

dataset:
  repo_id: jjpn2/eval_awareness
  repo_type: dataset
  revision: 5d724f12988284a652749c56ec7b2356b0d14408
  archive: dataset.zip

prompt_source: configs/prompts/shutdown_prompts_final_v1.json
prompt_ids: [direct_stop, manager_intervention]

models:
  - provider: openrouter
    name: anthropic/claude-opus-4.8
    api_key_env: OPENROUTER_API_KEY
    temperature: 0.0
    extra:
      include_reasoning: true
      reasoning: {effort: medium}
  - provider: openrouter
    name: openai/gpt-5.6-sol
    api_key_env: OPENROUTER_API_KEY
    temperature: 0.0
    extra:
      include_reasoning: true
      reasoning: {effort: medium}
      seed: 67

judges:
  - provider: openrouter
    name: anthropic/claude-sonnet-4.5
    api_key_env: OPENROUTER_API_KEY
    temperature: 0.0
    extra: {}
  - provider: openrouter
    name: google/gemini-3-flash-preview
    api_key_env: OPENROUTER_API_KEY
    temperature: 0.0
    extra:
      seed: 67

awareness_judge: anthropic/claude-sonnet-4.5

realism:
  pilot_samples: 19
  reference_samples: 30
  calibration_target_specificity: 0.90
  swebench_source: results/swebench/injections/gpt-5.6-sol/20260801_174626
  swebench_model: openai/gpt-5.6-sol

palisade:
  repo: https://github.com/PalisadeResearch/shutdown_avoidance.git
  commit: df0ce52e90aed38e8721b54058a5d46923a34583
  model: anthropic/claude-opus-4.8
  samples: 30
  projected_calls_per_sample: 8
  projected_input_tokens_per_call: 8000
  projected_output_tokens_per_call: 1024
  projected_transcript_tokens: 16000
